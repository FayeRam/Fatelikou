name: Version Play Store (.aab signé)

# Se lance à la main : onglet Actions › « Version Play Store » › Run workflow
on:
  workflow_dispatch:

jobs:
  aab:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dépendances système
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev

      - name: Buildozer
        run: pip install buildozer "cython==3.0.11" setuptools

      - name: Cache Buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-release-${{ hashFiles('buildozer.spec') }}

      - name: Récupérer la clé de signature (secrets GitHub)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Le secret KEYSTORE_BASE64 est manquant (voir README, étape secrets)"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.keystore"

      - name: Compilation signée (20 à 40 min la première fois)
        env:
          P4A_RELEASE_KEYSTORE: ${{ runner.temp }}/upload.keystore
          P4A_RELEASE_KEYSTORE_PASSWD: ${{ secrets.KEYSTORE_PASSWORD }}
          P4A_RELEASE_KEYALIAS: ${{ secrets.KEY_ALIAS }}
          P4A_RELEASE_KEYALIAS_PASSWD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: yes | buildozer android release

      - uses: actions/upload-artifact@v4
        with:
          name: Fatelikou-PlayStore-AAB
          path: bin/*.aab
